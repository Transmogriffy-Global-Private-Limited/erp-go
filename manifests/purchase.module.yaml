module_id: purchase
name: Purchase
version: 0.1.0
status: planned

depends_on:
  - core
  - documents
  - audit
  - workflow
  - inventory
  - accounting

permissions:
  - purchase.supplier.read
  - purchase.supplier.write
  - purchase.receipt.read
  - purchase.receipt.write
  - purchase.receipt.reverse
  - purchase.order.read
  - purchase.order.create
  - purchase.order.approve
  - purchase.grn.read
  - purchase.grn.create

api:
  routes:
    - method: GET
      path: /api/v1/purchase/suppliers
      permission: purchase.supplier.read

    - method: POST
      path: /api/v1/purchase/suppliers
      permission: purchase.supplier.write

    - method: GET
      path: /api/v1/purchase/receipts
      permission: purchase.receipt.read

    - method: POST
      path: /api/v1/purchase/receipts
      permission: purchase.receipt.write

    - method: POST
      path: /api/v1/purchase/receipts/{receipt_id}/reverse
      permission: purchase.receipt.reverse

    - method: GET
      path: /api/v1/purchase/orders
      permission: purchase.order.read

    - method: POST
      path: /api/v1/purchase/orders
      permission: purchase.order.create

    - method: POST
      path: /api/v1/purchase/orders/{purchase_order_id}/approve
      permission: purchase.order.approve

database:
  schema: purchase
  owns_tables:
    - purchase.suppliers
    - purchase.receipts
    - purchase.receipt_lines
    - purchase.purchase_orders
    - purchase.purchase_order_lines
    - purchase.grns

events:
  publishes:
    - purchase.supplier.created.v1
    - purchase.receipt.created.v1
    - purchase.receipt.reversed.v1
    - purchase.order.created.v1
    - purchase.order.approved.v1
    - purchase.order.partially_received.v1
    - purchase.order.received.v1
    - purchase.order.receipt_progress_reopened.v1
    - purchase.grn.posted.v1

  subscribes:
    - accounting.journal.posted.v1
    - inventory.stock.changed.v1

files:
  attachment_types:
    - supplier_document
    - purchase_order_attachment
    - supplier_invoice

reports:
  - purchase_register
  - pending_purchase_orders
  - supplier_outstanding
