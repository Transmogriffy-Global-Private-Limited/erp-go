module_id: sales
name: Sales
version: 0.1.0
status: planned

depends_on:
  - core
  - documents
  - audit
  - workflow
  - inventory
  - accounting

permissions:
  - sales.customer.read
  - sales.customer.write
  - sales.order.read
  - sales.order.create
  - sales.order.approve
  - sales.issue.read
  - sales.issue.write
  - sales.issue.reverse
  - sales.invoice.read
  - sales.invoice.create
  - sales.invoice.cancel

api:
  routes:
    - method: GET
      path: /api/v1/sales/customers
      permission: sales.customer.read

    - method: POST
      path: /api/v1/sales/customers
      permission: sales.customer.write

    - method: GET
      path: /api/v1/sales/orders
      permission: sales.order.read

    - method: POST
      path: /api/v1/sales/orders
      permission: sales.order.create

    - method: POST
      path: /api/v1/sales/orders/{sales_order_id}/confirm
      permission: sales.order.approve

    - method: GET
      path: /api/v1/sales/issues
      permission: sales.issue.read

    - method: POST
      path: /api/v1/sales/issues
      permission: sales.issue.write

    - method: POST
      path: /api/v1/sales/issues/{sales_issue_id}/reverse
      permission: sales.issue.reverse

database:
  schema: sales
  owns_tables:
    - sales.customers
    - sales.orders
    - sales.order_lines
    - sales.issues
    - sales.issue_lines
    - sales.invoices

events:
  publishes:
    - sales.customer.created.v1
    - sales.order.created.v1
    - sales.order.confirmed.v1
    - sales.order.partially_fulfilled.v1
    - sales.order.fulfilled.v1
    - sales.issue.posted.v1
    - sales.issue.reversed.v1
    - sales.order.fulfillment_reopened.v1
    - sales.invoice.created.v1
    - sales.invoice.cancelled.v1

  subscribes:
    - inventory.stock.reserved.v1
    - inventory.stock.released.v1
    - accounting.journal.posted.v1

files:
  attachment_types:
    - customer_document
    - sales_order_attachment
    - invoice_pdf

reports:
  - daily_sales
  - sales_register
  - customer_outstanding
